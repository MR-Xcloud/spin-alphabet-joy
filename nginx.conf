server {
  listen 8548;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Serve the app from /spin-alphabet-joy/
  location /spin-alphabet-joy/ {
    try_files $uri $uri/ /spin-alphabet-joy/index.html;
  }

  # Redirect bare root to the app route (optional)
  location = / {
    return 302 /spin-alphabet-joy/;
  }

  # Ensure requests without trailing slash redirect to the slash version
  location /spin-alphabet-joy {
    return 302 /spin-alphabet-joy/;
  }

  # Cache static assets aggressively
  location ~* \.(?:css|js|json|html|png|jpg|jpeg|svg|ico|woff2?)$ {
    try_files $uri =404;
    expires max;
    add_header Cache-Control "public";
  }
}